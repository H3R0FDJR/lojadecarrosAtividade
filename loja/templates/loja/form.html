{% extends 'loja/base.html' %}

{% block content %}
  {% if object %}
    <h2>Editar Carro: {{ object.modelo }}</h2>
  {% else %}
    <h2>Cadastrar Novo Carro</h2>
  {% endif %}

  <form method="POST">
    {% csrf_token %} {{ form.as_p }}

    <button type="submit" class="btn">Salvar</button>
  </form>
{% endblock content %}
